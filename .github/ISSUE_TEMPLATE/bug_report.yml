name: Bug report
description: Report a reproducible problem in Textr
body:
  - type: markdown
    attributes:
      value: Use synthetic files. Do not attach private documents, credentials or signing keys. Security reports belong in the channel described in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include how you opened the file, its format, display mode, and whether it happens with a small synthetic sample.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Textr version or commit, Android version, device/emulator and Android System WebView version. Mention language, font size and window size for layout issues.
    validations:
      required: true
