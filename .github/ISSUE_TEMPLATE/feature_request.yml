name: Feature request
description: Suggest an improvement to reading text files
body:
  - type: textarea
    id: problem
    attributes:
      label: What reading problem would this solve?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Consider Textr’s minimal, offline, read-only scope.
    validations:
      required: true
