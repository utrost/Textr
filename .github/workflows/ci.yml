name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and check
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Verify unsigned F-Droid release build
        run: |
          ./gradlew :app:assembleRelease -PtextrUnsignedRelease=true --stacktrace
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"; then
            echo 'Expected an unsigned F-Droid build, but the APK has a valid signature.' >&2
            exit 1
          fi
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='de.utrost.textr'"
          if printf '%s\n' "$badging" | grep -q 'application-debuggable'; then
            echo 'F-Droid release APK must not be debuggable.' >&2
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -Fq 'android.permission.INTERNET'; then
            echo 'F-Droid release APK must not declare INTERNET permission.' >&2
            exit 1
          fi
      - name: Check owner signing guard and disposable signed build
        run: |
          if ./gradlew :app:verifyReleaseCredentials > signing-guard.log 2>&1; then
            echo 'Owner release signing unexpectedly passed without credentials.' >&2
            exit 1
          fi
          grep -Fq 'Release signing requires TEXTR_SIGNING_PROPERTIES' signing-guard.log
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir" signing-guard.log' EXIT
          export TEXTR_TEST_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$test_dir/disposable.p12" -storetype PKCS12 \
            -alias textr-test -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Textr Disposable Build Check' \
            -storepass:env TEXTR_TEST_PASS -keypass:env TEXTR_TEST_PASS -noprompt >/dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=textr-test\nkeyPassword=%s\n' \
            "$test_dir/disposable.p12" "$TEXTR_TEST_PASS" "$TEXTR_TEST_PASS" > "$test_dir/signing.properties"
          chmod 600 "$test_dir/signing.properties"
          TEXTR_SIGNING_PROPERTIES="$test_dir/signing.properties" ./gradlew :app:assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: textr-debug-development-only-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  device:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Retain device reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
