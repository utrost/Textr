AutoName: Textr
Summary: Read text and edit separate copies offline
Description: |-
  Read text, code and Markdown offline. Original files remain unchanged.
  Explicitly edit and save separate TXT/Markdown copies, preview drafts,
  compare snapshots and export exact unified diffs. Organize references in
  collections. Includes JSON Lines navigation and bounded format support.

  No accounts, advertisements, analytics or app network permission.
  Android 10 or newer. English and German interface. Resource limits apply.

